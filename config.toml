title = "Anurag Kar"
baseURL = "https://anuragkar.netlify.app/"
relativeURLs = true
disableKinds = ["page", "section", "taxonomy", "term"]

enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
canonifyURLs = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1

[params]
Author = "Anurag Kar"
Description = "Anurag Kar: backend engineer in Bengaluru, and domain partner at Auragika."
github = "https://github.com/anuragdevon"
facebook = "https://www.facebook.com/anurag.kar.395"
sitename = "anuragdevon"
twitter = "https://twitter.com/AnuragKar016"
logo = "images/logo/favicon.webp"

[[menus.sections]]
name = "About"
weight = 1

[[menus.sections]]
name = "Projects"
weight = 2

[[menus.sections]]
name = "Blogs"
