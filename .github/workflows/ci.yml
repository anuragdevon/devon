# Quality gates for every push to main and every pull request. Nothing here deploys:
# Netlify builds and deploys from git on its own.
#
# Locally: npm test   (production build with --panicOnWarning, tools/check-build.mjs, browser tests)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  HUGO_VERSION: '0.163.3' # keep equal to netlify.toml

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:test
      - run: npm run check
      # Ubuntu 24.04+ blocks the user namespaces Chrome's sandbox needs; allow them on this
      # throwaway VM rather than running Chrome with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:browser
        timeout-minutes: 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
