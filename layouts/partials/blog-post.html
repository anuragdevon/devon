{{/* One blog post, rendered from its standalone HTML source in blog-src/.
     Usage: {{ partial "blog-post" "cascade-blog.html" }}
     The source's <head>, inline <script>, footer and progress bar are stripped; behaviour
     comes from assets/js/blog.js so the CSP can keep script-src 'self'. */}}
{{ $raw := readFile (path.Join "blog-src" .) }}
{{ $body := replaceRE `(?s)^.*<body>\s*` "" $raw }}
{{ $body = replaceRE `(?s)\s*</body>.*$` "" $body }}
{{ $body = replaceRE `(?s)<script\b.*?</script>` "" $body }}
{{ $body = replaceRE `(?s)<footer>.*?</footer>` "" $body }}
{{ $body = replaceRE `(?s)<div id="progress-bar">.*?</div></div>` "" $body }}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap">

<div id="progress-bar"><div id="progress-fill"></div></div>

<section id="blogs">
  <div class="container blog andromeda-blog-host py-4 py-md-5">
    <div class="section-title animate-on-scroll">
      <h2>Blog</h2>
    </div>
    <div class="card">
      <div class="card-body andromeda-blog-content">
        {{ $body | safeHTML }}
      </div>
    </div>
  </div>
</section>
