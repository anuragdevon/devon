{{ define "main" }}
{{ with site.Data.projects }}
<section id="projects">
  <div class="container project">
    <div class="section-title animate-on-scroll">
      <h2>Projects</h2>
      <p>Things I've built.</p>
    </div>
    {{ range $i, $p := .project }}
    <div class="proj-card animate-on-scroll stagger-{{ add (mod $i 8) 1 }}">
      <div class="proj-head">
        <h3 class="proj-title">{{ $p.title }}</h3>
        <span class="proj-date">{{ $p.date }}</span>
      </div>
      <p class="proj-desc">{{ $p.sample }}</p>
      <div class="proj-foot">
        <div class="proj-tech">
          {{ range $p.tech }}
          {{ partial "inline-svg" . }}
          {{ end }}
        </div>
        <a href="{{ $p.link }}" target="_blank" rel="noopener" class="proj-link">View →</a>
      </div>
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
